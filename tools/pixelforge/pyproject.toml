[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge"
version = "0.1.0"
description = "Research and tools for generating, cleaning and animating pixel-art sprites for games (Godot export included)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
d2 = ["d2animdata>=0.2"]   # the free AnimData.d2 tool the Diablo 2 bridge prefers (a built-in reader stands in without it)
train = [
  "torch>=2.2",
  "diffusers>=0.30",
  "transformers>=4.40",
  "accelerate>=0.30",
  "peft>=0.11",
  "safetensors",
]

[project.scripts]
pixelforge = "pixelforge.cli:main"

[tool.setuptools]
packages = ["pixelforge", "pixelforge.music", "pixelforge.blender", "pixelforge.d2"]

[tool.setuptools.package-data]
pixelforge = ["music/library/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
